name: Check DNS Connect release signing setup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-release-secrets.yml"

permissions:
  contents: read

jobs:
  check-signing-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check only whether required secrets exist
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$KEYSTORE_B64" ]] || missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -n "$KEY_ALIAS" ]] || missing+=("ANDROID_KEY_ALIAS")
          [[ -n "$KEY_PASSWORD" ]] || missing+=("ANDROID_KEY_PASSWORD")
          if (("${#missing[@]}" == 0)); then
            echo "All required signing secrets are configured."
            echo "Signing setup: READY" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Missing signing secrets: %s\n' "${missing[*]}"
            {
              echo "## Signing setup: NEEDS CONFIGURATION"
              echo
              echo "Add these repository secrets under Settings → Secrets and variables → Actions:"
              printf -- '- `%s`\n' "${missing[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          unset KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
