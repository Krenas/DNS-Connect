name: Check DNS Connect release signing setup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-release-secrets.yml"

permissions:
  contents: read

jobs:
  check-signing-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check only whether required secrets exist
        env:
          SIGNING_BUNDLE: ${{ secrets.DNS_CONNECT_SIGNING_BUNDLE }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$SIGNING_BUNDLE" ]] || missing+=("DNS_CONNECT_SIGNING_BUNDLE")
          if (("${#missing[@]}" == 0)); then
            echo "All required signing secrets are configured."
            echo "Signing setup: READY" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Missing signing secrets: %s\n' "${missing[*]}"
            {
              echo "## Signing setup: NEEDS CONFIGURATION"
              echo
              echo "Add these repository secrets under Settings → Secrets and variables → Actions:"
              printf -- '- %s\n' "${missing[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          unset SIGNING_BUNDLE
