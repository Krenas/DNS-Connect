name: Publish APK and source uploaded to a temporary branch

on:
  push:
    branches:
      - "apk-upload/**"
    paths:
      - "incoming/*.apk"
      - "incoming/*.zip"

permissions:
  contents: write

concurrency:
  group: dns-connect-apk-release-pipeline
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: startsWith(github.ref, 'refs/heads/apk-upload/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out uploaded branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Android build tools
        uses: android-actions/setup-android@v3

      - name: Validate APK and source archive
        env:
          EXPECTED_PACKAGE: ru.krenas.dnsanalytics
          EXPECTED_CERT_SHA256: 4dc48085b7ea161b57e6266611c5d6a28514df6f2ddfc26df14f3ac972debf90
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "build-tools;35.0.0"

          [[ "$GITHUB_REF_NAME" =~ ^apk-upload/v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || {
            echo "Branch must be apk-upload/vMAJOR.MINOR.PATCH." >&2
            exit 1
          }
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          TAG="v$VERSION"
          APK_NAME="DNS-Connect-$VERSION-release.apk"
          SOURCE_NAME="DNS-Connect-$VERSION-source.zip"

          shopt -s nullglob
          APKS=(incoming/*.apk)
          SOURCES=(incoming/*.zip)
          [ "${#APKS[@]}" -eq 1 ] || { echo "Expected exactly one APK in incoming/." >&2; exit 1; }
          [ "${#SOURCES[@]}" -eq 1 ] || { echo "Expected exactly one source ZIP in incoming/." >&2; exit 1; }
          APK="${APKS[0]}"
          SOURCE_ZIP="${SOURCES[0]}"
          [ "$(basename "$APK")" = "$APK_NAME" ] || { echo "APK filename mismatch." >&2; exit 1; }
          [ "$(basename "$SOURCE_ZIP")" = "$SOURCE_NAME" ] || { echo "Source ZIP filename mismatch." >&2; exit 1; }
          cp "$APK" "$RUNNER_TEMP/$APK_NAME"
          cp "$SOURCE_ZIP" "$RUNNER_TEMP/$SOURCE_NAME"

          unzip -tq "$SOURCE_ZIP" >/dev/null
          unzip -Z1 "$SOURCE_ZIP" > source-files.txt
          if grep -Eq '(^/|(^|/)\.\.(/|$))' source-files.txt; then
            echo "Unsafe path found in source archive." >&2
            exit 1
          fi
          grep -qx 'app/build.gradle.kts' source-files.txt
          grep -qx 'settings.gradle.kts' source-files.txt
          grep -qx 'gradle/wrapper/gradle-wrapper.jar' source-files.txt
          grep -qx 'app/src/main/AndroidManifest.xml' source-files.txt
          if grep -Eiq '\.(jks|keystore|p12|pfx|pem|pk8)$|(^|/)[^/]*password[^/]*$' source-files.txt; then
            echo "Signing material or password file found in source archive." >&2
            exit 1
          fi

          unzip -p "$SOURCE_ZIP" app/build.gradle.kts > source-app.gradle.kts
          SOURCE_VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' source-app.gradle.kts | head -n1)"
          SOURCE_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' source-app.gradle.kts | head -n1)"
          SOURCE_PACKAGE="$(sed -nE 's/^[[:space:]]*applicationId[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' source-app.gradle.kts | head -n1)"

          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "${APKS[0]}")"
          PACKAGE="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n1)"
          APK_VERSION="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n1)"
          VERSION_CODE="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n1)"
          [ "$PACKAGE" = "$EXPECTED_PACKAGE" ] || { echo "Unexpected APK package." >&2; exit 1; }
          [ "$APK_VERSION" = "$VERSION" ] || { echo "APK version does not match branch." >&2; exit 1; }
          [ "$SOURCE_VERSION" = "$VERSION" ] || { echo "Source version does not match branch." >&2; exit 1; }
          [ "$SOURCE_PACKAGE" = "$EXPECTED_PACKAGE" ] || { echo "Source package mismatch." >&2; exit 1; }
          [ "$SOURCE_CODE" = "$VERSION_CODE" ] || { echo "Source versionCode does not match APK." >&2; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] && [ "$VERSION_CODE" -gt 0 ] || { echo "Invalid versionCode." >&2; exit 1; }

          SIGNATURE="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK")"
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: *//p' <<< "$SIGNATURE" | head -n1 | tr '[:upper:]' '[:lower:]')"
          [ "$CERT" = "$EXPECTED_CERT_SHA256" ] || { echo "APK signing certificate mismatch." >&2; exit 1; }

          CURRENT_MANIFEST="$(curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/latest.json")"
          CURRENT_VERSION="$(jq -r '.version // "0.0.0"' <<< "$CURRENT_MANIFEST")"
          CURRENT_CODE="$(jq -r '.versionCode // 0' <<< "$CURRENT_MANIFEST")"
          dpkg --compare-versions "$VERSION" gt "$CURRENT_VERSION" || { echo "Version is not newer than current release." >&2; exit 1; }
          [ "$VERSION_CODE" -gt "$CURRENT_CODE" ] || { echo "versionCode is not newer than current release." >&2; exit 1; }

          APK_SIZE="$(wc -c < "$APK" | tr -d ' ')"
          SOURCE_SIZE="$(wc -c < "$SOURCE_ZIP" | tr -d ' ')"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SOURCE_SHA256="$(sha256sum "$SOURCE_ZIP" | awk '{print $1}')"
          [ "$APK_SIZE" -gt 0 ] && [ "$APK_SIZE" -le 104857600 ]
          [ "$SOURCE_SIZE" -gt 0 ] && [ "$SOURCE_SIZE" -le 52428800 ]

          {
            echo "VERSION=$VERSION"
            echo "TAG=$TAG"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "APK_SIZE=$APK_SIZE"
            echo "SOURCE_SIZE=$SOURCE_SIZE"
            echo "APK_SHA256=$APK_SHA256"
            echo "SOURCE_SHA256=$SOURCE_SHA256"
            echo "UPLOAD_APK=$RUNNER_TEMP/$APK_NAME"
            echo "UPLOAD_SOURCE=$RUNNER_TEMP/$SOURCE_NAME"
          } >> "$GITHUB_ENV"

      - name: Import source snapshot into main before tagging the release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-tree"
          unzip -q "incoming/DNS-Connect-$VERSION-source.zip" -d "$RUNNER_TEMP/source-tree"
          git fetch origin main
          git checkout main
          rsync -a --delete --exclude='.git/' --exclude='.github/' \
            --exclude='HANDOFF.md' --exclude='README.md' \
            "$RUNNER_TEMP/source-tree/" "$GITHUB_WORKSPACE/"
          chmod +x ./gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import DNS Connect $VERSION source snapshot"
            git push origin HEAD:main
          fi

      - name: Create release, upload APK and source archive, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --draft \
            --title "DNS Connect $VERSION" \
            --notes "DNS Connect $VERSION. APK, source archive, package, version and signing certificate validated."
          gh release upload "$TAG" \
            "$UPLOAD_APK" \
            "$UPLOAD_SOURCE" \
            --repo "$GITHUB_REPOSITORY"

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          jq -e --arg apk "$APK_NAME" --arg source "$SOURCE_NAME" \
            --arg ad "sha256:$APK_SHA256" --arg sd "sha256:$SOURCE_SHA256" \
            --argjson apk_size "$APK_SIZE" --argjson source_size "$SOURCE_SIZE" '
            [.assets[] | select(.name == $apk and .state == "uploaded" and .digest == $ad and .size == $apk_size)] | length == 1
          ' release.json >/dev/null
          jq -e --arg source "$SOURCE_NAME" --arg sd "sha256:$SOURCE_SHA256" \
            --argjson source_size "$SOURCE_SIZE" '
            [.assets[] | select(.name == $source and .state == "uploaded" and .digest == $sd and .size == $source_size)] | length == 1
          ' release.json >/dev/null
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Publish latest.json directly and confirm public update source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/DNS-Connect-$VERSION-release.apk"
          SOURCE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/DNS-Connect-$VERSION-source.zip"
          jq -n \
            --arg version "$VERSION" --arg tag "$TAG" \
            --arg apk "$APK_URL" --arg sha256 "$APK_SHA256" \
            --arg source "$SOURCE_URL" --arg sourceSha256 "$SOURCE_SHA256" \
            --arg release "$RELEASE_URL" \
            --argjson versionCode "$VERSION_CODE" \
            --argjson size "$APK_SIZE" --argjson sourceSize "$SOURCE_SIZE" \
            '{version:$version,tag:$tag,versionCode:$versionCode,apk:$apk,sha256:$sha256,size:$size,sourceArchive:$source,sourceSha256:$sourceSha256,sourceSize:$sourceSize,release:$release,notes:"Verified by GitHub Actions"}' \
            > latest.json
          EXISTING_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/latest.json?ref=main" --jq .sha)"
          CONTENT="$(base64 -w 0 latest.json)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" \
            -f message="Publish DNS Connect $VERSION update manifest" \
            -f branch=main -f sha="$EXISTING_SHA" -f content="$CONTENT" >/dev/null

          for attempt in $(seq 1 12); do
            if curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/latest.json?check=$attempt" -o latest-public.json && \
               jq -e --arg v "$VERSION" --arg t "$TAG" --arg s "$APK_SHA256" --arg src "$SOURCE_URL" \
                 '.version == $v and .tag == $t and .sha256 == $s and .sourceArchive == $src' \
                 latest-public.json >/dev/null; then
              echo "Public latest.json verified."
              exit 0
            fi
            sleep 5
          done
          echo "Public latest.json was not updated." >&2
          exit 1

      - name: Remove temporary upload branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME" || true
