name: Build and publish DNS Connect from repository source

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Stable release tag, for example v2.3.0"
        required: true
        type: string
      release_notes:
        description: "Release notes"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: dns-connect-build-release
  cancel-in-progress: false

jobs:
  build-test-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out project source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version and required secrets
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version_tag }}
          STORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || {
            echo "Tag must be vMAJOR.MINOR.PATCH." >&2; exit 1;
          }
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          SOURCE_VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)"
          [ "$SOURCE_VERSION" = "$VERSION" ] || {
            echo "app/build.gradle.kts versionName ($SOURCE_VERSION) does not match $VERSION." >&2; exit 1;
          }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "Invalid versionCode." >&2; exit 1; }
          for value in STORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!value}" ] || { echo "Missing repository secret: $value." >&2; exit 1; }
          done
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release with this tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          CURRENT_CODE="$(curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/latest.json" | jq -r '.versionCode // 0')"
          [ "$VERSION_CODE" -gt "$CURRENT_CODE" ] || {
            echo "versionCode must increase (current=$CURRENT_CODE, candidate=$VERSION_CODE)." >&2; exit 1;
          }
          {
            echo "VERSION=$VERSION"
            echo "TAG=$RELEASE_TAG"
            echo "VERSION_CODE=$VERSION_CODE"
          } >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Restore signing keystore from encrypted repository secret
        env:
          STORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/dns-connect-release.jks"
          test -s "$RUNNER_TEMP/dns-connect-release.jks"
          chmod 600 "$RUNNER_TEMP/dns-connect-release.jks"

      - name: Run source regression checks
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          sed -i -E "s/versionCode = [0-9]+/versionCode = $VERSION_CODE/" tests/verify-ui.sh
          sed -i -E "s/versionName = \"[0-9]+\\.[0-9]+\\.[0-9]+\"/versionName = \"$VERSION\"/" tests/verify-ui.sh
          bash tests/verify-ui.sh
          python3 tests/verify-catalogue.py
          python3 tests/verify-icons.py
          python3 tests/verify-previews.py

      - name: Build signed release APK
        env:
          DNS_RELEASE_KEYSTORE: ${{ runner.temp }}/dns-connect-release.jks
          DNS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DNS_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DNS_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean :app:assembleRelease

      - name: Verify APK package, version, certificate and create source archive
        id: package
        env:
          EXPECTED_CERT_SHA256: 4dc48085b7ea161b57e6266611c5d6a28514df6f2ddfc26df14f3ac972debf90
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          PACKAGE="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n1)"
          APK_VERSION="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n1)"
          APK_CODE="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n1)"
          [ "$PACKAGE" = "ru.krenas.dnsanalytics" ]
          [ "$APK_VERSION" = "$VERSION" ]
          [ "$APK_CODE" = "$VERSION_CODE" ]
          SIGNATURE="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK")"
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: *//p' <<< "$SIGNATURE" | head -n1 | tr '[:upper:]' '[:lower:]')"
          [ "$CERT" = "$EXPECTED_CERT_SHA256" ] || {
            echo "Signing certificate mismatch." >&2; exit 1;
          }
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          cp "$APK" "DNS-Connect-$VERSION-release.apk"
          git archive --format=zip HEAD > "DNS-Connect-$VERSION-source.zip"
          sha256sum "DNS-Connect-$VERSION-release.apk" "DNS-Connect-$VERSION-source.zip" > "DNS-Connect-$VERSION-SHA256SUMS.txt"
          echo "APK_SHA256=$(sha256sum "DNS-Connect-$VERSION-release.apk" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(wc -c < "DNS-Connect-$VERSION-release.apk" | tr -d ' ')" >> "$GITHUB_ENV"
          echo "SOURCE_SHA256=$(sha256sum "DNS-Connect-$VERSION-source.zip" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "SOURCE_SIZE=$(wc -c < "DNS-Connect-$VERSION-source.zip" | tr -d ' ')" >> "$GITHUB_ENV"

      - name: Create draft release and upload versioned files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --draft \
            --title "DNS Connect $VERSION" --notes "$RELEASE_NOTES"
          gh release upload "$TAG" \
            "DNS-Connect-$VERSION-release.apk" \
            "DNS-Connect-$VERSION-source.zip" \
            "DNS-Connect-$VERSION-SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify release assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          jq -e --arg apk "DNS-Connect-$VERSION-release.apk" \
            --arg source "DNS-Connect-$VERSION-source.zip" \
            --arg apk_digest "sha256:$APK_SHA256" \
            --arg source_digest "sha256:$SOURCE_SHA256" \
            --argjson apk_size "$APK_SIZE" --argjson source_size "$SOURCE_SIZE" '
            [.assets[] | select(.name == $apk and .state == "uploaded" and .digest == $apk_digest and .size == $apk_size)] | length == 1
          ' release.json >/dev/null
          jq -e --arg source "DNS-Connect-$VERSION-source.zip" \
            --arg source_digest "sha256:$SOURCE_SHA256" --argjson source_size "$SOURCE_SIZE" '
            [.assets[] | select(.name == $source and .state == "uploaded" and .digest == $source_digest and .size == $source_size)] | length == 1
          ' release.json >/dev/null
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Publish verified latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg version "$VERSION" --arg tag "$TAG" \
            --arg apk "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/DNS-Connect-$VERSION-release.apk" \
            --arg sha256 "$APK_SHA256" \
            --arg source "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/DNS-Connect-$VERSION-source.zip" \
            --arg sourceSha256 "$SOURCE_SHA256" \
            --arg release "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --arg notes "$RELEASE_NOTES" \
            --argjson versionCode "$VERSION_CODE" \
            --argjson size "$APK_SIZE" --argjson sourceSize "$SOURCE_SIZE" \
            '{version:$version,tag:$tag,versionCode:$versionCode,apk:$apk,sha256:$sha256,size:$size,sourceArchive:$source,sourceSha256:$sourceSha256,sourceSize:$sourceSize,release:$release,notes:$notes}' \
            > latest.json
          EXISTING_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/latest.json?ref=main" --jq .sha)"
          CONTENT="$(base64 -w 0 latest.json)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" \
            -f message="Publish DNS Connect $VERSION update manifest" \
            -f branch=main -f sha="$EXISTING_SHA" -f content="$CONTENT" >/dev/null
          for attempt in $(seq 1 12); do
            if curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/latest.json?check=$attempt" -o latest-public.json && \
               jq -e --arg version "$VERSION" --arg tag "$TAG" --arg sha "$APK_SHA256" \
                 '.version == $version and .tag == $tag and .sha256 == $sha and (.sourceArchive | type == "string")' \
                 latest-public.json >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Public latest.json validation failed." >&2
          exit 1

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/dns-connect-release.jks"
