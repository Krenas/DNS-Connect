name: Build APK from source ZIP and publish update

on:
  push:
    branches: [main]
    paths:
      - "incoming/DNS-Connect-*-source.zip"
  workflow_dispatch:
    inputs:
      source_archive:
        description: "Committed ZIP path, e.g. incoming/DNS-Connect-2.3.0-source.zip"
        required: true
        default: "incoming/DNS-Connect-2.3.0-source.zip"
        type: string
      release_notes:
        description: "Release notes; leave blank to use CHANGELOG.md"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: dns-connect-archive-release
  cancel-in-progress: false

jobs:
  build-test-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve source ZIP and release metadata
        id: meta
        env:
          SOURCE_INPUT: ${{ inputs.source_archive }}
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
          GH_TOKEN: ${{ github.token }}
          STORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_PATH="${SOURCE_INPUT:-}"
          if [[ -z "$SOURCE_PATH" ]]; then
            mapfile -t sources < <(find incoming -maxdepth 1 -type f -name 'DNS-Connect-*-source.zip' -print 2>/dev/null | sort)
            [[ "${#sources[@]}" -eq 1 ]] || {
              echo "Expected exactly one incoming/DNS-Connect-*-source.zip archive." >&2
              printf '%s\n' "${sources[@]}" >&2
              exit 1
            }
            SOURCE_PATH="${sources[0]}"
          fi
          [[ "$SOURCE_PATH" == incoming/DNS-Connect-*-source.zip ]]
          [[ -s "$SOURCE_PATH" ]]
          for value in STORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!value}" ]] || {
              echo "Missing GitHub Actions secret: $value. Configure the four ANDROID_* secrets once in repository Settings > Secrets and variables > Actions." >&2
              exit 1
            }
          done
          mkdir -p "$RUNNER_TEMP/dns-source"
          cp "$SOURCE_PATH" "$RUNNER_TEMP/DNS-Connect-source-input.zip"
          unzip -tq "$RUNNER_TEMP/DNS-Connect-source-input.zip" >/dev/null
          python3 - "$RUNNER_TEMP/DNS-Connect-source-input.zip" <<'PY'
          import sys, zipfile, stat
          archive = zipfile.ZipFile(sys.argv[1])
          for item in archive.infolist():
              name = item.filename.replace(chr(92), '/')
              parts = name.split('/')
              if name.startswith('/') or any(p in ('', '..') for p in parts if p != ''):
                  raise SystemExit(f"Unsafe ZIP path: {item.filename}")
              if stat.S_ISLNK(item.external_attr >> 16):
                  raise SystemExit(f"Symlink entry is not allowed: {item.filename}")
              if item.file_size > 100 * 1024 * 1024:
                  raise SystemExit(f"Unreasonably large ZIP entry: {item.filename}")
          PY
          unzip -Z1 "$RUNNER_TEMP/DNS-Connect-source-input.zip" > "$RUNNER_TEMP/source-files.txt"
          grep -qx 'app/build.gradle.kts' "$RUNNER_TEMP/source-files.txt"
          grep -qx 'settings.gradle.kts' "$RUNNER_TEMP/source-files.txt"
          grep -qx 'gradle/wrapper/gradle-wrapper.jar' "$RUNNER_TEMP/source-files.txt"
          grep -qx 'app/src/main/AndroidManifest.xml' "$RUNNER_TEMP/source-files.txt"
          if grep -Eiq '\.(jks|keystore|p12|pfx|pem|pk8)$|(^|/)[^/]*password[^/]*$' "$RUNNER_TEMP/source-files.txt"; then
            echo "Signing material or password file is not allowed in the source ZIP." >&2
            exit 1
          fi
          unzip -q "$RUNNER_TEMP/DNS-Connect-source-input.zip" -d "$RUNNER_TEMP/dns-source"
          SRC="$RUNNER_TEMP/dns-source"
          VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$SRC/app/build.gradle.kts" | head -n1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$SRC/app/build.gradle.kts" | head -n1)"
          PACKAGE="$(sed -nE 's/^[[:space:]]*applicationId[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$SRC/app/build.gradle.kts" | head -n1)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]
          [[ "$PACKAGE" == "ru.krenas.dnsanalytics" ]]
          CURRENT_CODE="$(jq -r '.versionCode // 0' latest.json)"
          (( VERSION_CODE > CURRENT_CODE )) || {
            echo "Refusing downgrade: source versionCode=$VERSION_CODE, public latest versionCode=$CURRENT_CODE." >&2
            exit 1
          }
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite." >&2
            exit 1
          fi
          NOTES="$RELEASE_NOTES_INPUT"
          if [[ -z "$NOTES" ]]; then
            NOTES="$(awk -v v="$VERSION" '$0 ~ "^## "v"([[:space:]]|$)" {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md)"
          fi
          [[ -n "$NOTES" ]] || NOTES="DNS Connect $VERSION"
          {
            echo "SOURCE_PATH=$SOURCE_PATH"
            echo "VERSION=$VERSION"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "PACKAGE=$PACKAGE"
            echo "TAG=$TAG"
            echo "RELEASE_NOTES<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Set up Java and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Restore the private signing key
        env:
          STORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/dns-connect-release.jks"
          test -s "$RUNNER_TEMP/dns-connect-release.jks"
          chmod 600 "$RUNNER_TEMP/dns-connect-release.jks"

      - name: Run regression checks from the source archive
        working-directory: ${{ runner.temp }}/dns-source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          [[ -f tests/verify-ui.sh ]] && bash tests/verify-ui.sh
          [[ -f tests/verify-catalogue.py ]] && python3 tests/verify-catalogue.py
          [[ -f tests/verify-icons.py ]] && python3 tests/verify-icons.py
          [[ -f tests/verify-previews.py ]] && python3 tests/verify-previews.py

      - name: Build signed release APK
        working-directory: ${{ runner.temp }}/dns-source
        env:
          DNS_RELEASE_KEYSTORE: ${{ runner.temp }}/dns-connect-release.jks
          DNS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DNS_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DNS_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean :app:assembleRelease

      - name: Verify APK and prepare versioned release assets
        env:
          EXPECTED_CERT_SHA256: 4dc48085b7ea161b57e6266611c5d6a28514df6f2ddfc26df14f3ac972debf90
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/dns-source"
          APK="$SRC/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          APK_PACKAGE="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n1)"
          APK_VERSION="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n1)"
          APK_CODE="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n1)"
          [[ "$APK_PACKAGE" == "$PACKAGE" && "$APK_VERSION" == "$VERSION" && "$APK_CODE" == "$VERSION_CODE" ]]
          SIGNATURE="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK")"
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: *//p' <<< "$SIGNATURE" | head -n1 | tr '[:upper:]' '[:lower:]')"
          [[ "$CERT" == "$EXPECTED_CERT_SHA256" ]] || {
            echo "APK signer does not match the retained release certificate." >&2
            exit 1
          }
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          mkdir -p "$RUNNER_TEMP/release"
          cp "$APK" "$RUNNER_TEMP/release/DNS-Connect-$VERSION-release.apk"
          (
            cd "$SRC"
            zip -q -r "$RUNNER_TEMP/release/DNS-Connect-$VERSION-source.zip" . \
              -x './.git/*' './.git/**' './app/build/*' './app/build/**' './build/*' './build/**' \
                 './*.jks' './*.keystore' './*password*' './release-output/*' './release-output/**'
          )
          unzip -tq "$RUNNER_TEMP/release/DNS-Connect-$VERSION-source.zip" >/dev/null
          sha256sum "$RUNNER_TEMP/release/"* > "$RUNNER_TEMP/release/DNS-Connect-$VERSION-SHA256SUMS.txt"
          for name in "DNS-Connect-$VERSION-release.apk" "DNS-Connect-$VERSION-source.zip"; do
            file="$RUNNER_TEMP/release/$name"
            echo "$(basename "$file")_SHA256=$(sha256sum "$file" | awk '{print $1}')" >> "$GITHUB_ENV"
            echo "$(basename "$file")_SIZE=$(wc -c < "$file" | tr -d ' ')" >> "$GITHUB_ENV"
          done
          echo "APK_SHA256=$(sha256sum "$RUNNER_TEMP/release/DNS-Connect-$VERSION-release.apk" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(wc -c < "$RUNNER_TEMP/release/DNS-Connect-$VERSION-release.apk" | tr -d ' ')" >> "$GITHUB_ENV"
          echo "SOURCE_SHA256=$(sha256sum "$RUNNER_TEMP/release/DNS-Connect-$VERSION-source.zip" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "SOURCE_SIZE=$(wc -c < "$RUNNER_TEMP/release/DNS-Connect-$VERSION-source.zip" | tr -d ' ')" >> "$GITHUB_ENV"

      - name: Import verified source tree into main
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' --exclude='.github/' --exclude='incoming/' \
            --exclude='README.md' --exclude='HANDOFF.md' --exclude='CHECKPOINT.md' \
            --exclude='CHANGELOG.md' --exclude='latest.json' --exclude='SHA256SUMS.txt' \
            --exclude='bootstrap/' \
            "$RUNNER_TEMP/dns-source/" "$GITHUB_WORKSPACE/"
          chmod +x ./gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import verified DNS Connect $VERSION source"
            git push origin HEAD:main
          fi

      - name: Create draft Release and upload APK, source and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --draft \
            --title "DNS Connect $VERSION" --notes "$RELEASE_NOTES"
          gh release upload "$TAG" \
            "$RUNNER_TEMP/release/DNS-Connect-$VERSION-release.apk" \
            "$RUNNER_TEMP/release/DNS-Connect-$VERSION-source.zip" \
            "$RUNNER_TEMP/release/DNS-Connect-$VERSION-SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release/release.json"
          jq -e --arg apk "DNS-Connect-$VERSION-release.apk" \
            --arg src "DNS-Connect-$VERSION-source.zip" \
            --arg ad "sha256:$APK_SHA256" --arg sd "sha256:$SOURCE_SHA256" \
            --argjson asize "$APK_SIZE" --argjson ssize "$SOURCE_SIZE" '
            ([.assets[] | select(.name == $apk and .state == "uploaded" and .digest == $ad and .size == $asize)] | length == 1) and
            ([.assets[] | select(.name == $src and .state == "uploaded" and .digest == $sd and .size == $ssize)] | length == 1)
          ' "$RUNNER_TEMP/release/release.json" >/dev/null
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Publish latest.json for the in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/DNS-Connect-$VERSION-release.apk"
          SOURCE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/DNS-Connect-$VERSION-source.zip"
          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          jq -n \
            --arg version "$VERSION" --arg tag "$TAG" --arg apk "$APK_URL" \
            --arg sha256 "$APK_SHA256" --arg source "$SOURCE_URL" --arg sourceSha256 "$SOURCE_SHA256" \
            --arg release "$RELEASE_URL" --arg notes "$RELEASE_NOTES" \
            --argjson versionCode "$VERSION_CODE" --argjson size "$APK_SIZE" --argjson sourceSize "$SOURCE_SIZE" \
            '{version:$version,tag:$tag,versionCode:$versionCode,apk:$apk,sha256:$sha256,size:$size,sourceArchive:$source,sourceSha256:$sourceSha256,sourceSize:$sourceSize,release:$release,notes:$notes}' \
            > "$RUNNER_TEMP/release/latest.json"
          CONTENT="$(base64 -w 0 "$RUNNER_TEMP/release/latest.json")"
          EXISTING_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/latest.json?ref=main" --jq .sha)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" \
            -f message="Publish DNS Connect $VERSION update manifest" \
            -f branch=main -f sha="$EXISTING_SHA" -f content="$CONTENT" >/dev/null
          for attempt in $(seq 1 12); do
            if curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/latest.json?check=$attempt" -o "$RUNNER_TEMP/release/latest-public.json" && \
              jq -e --arg v "$VERSION" --arg t "$TAG" --arg sha "$APK_SHA256" \
                '.version == $v and .tag == $t and .sha256 == $sha and .versionCode > 0' \
                "$RUNNER_TEMP/release/latest-public.json" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Public latest.json did not match the new release." >&2
          exit 1

      - name: Remove uploaded source ZIP from the incoming folder
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rm -f "$SOURCE_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove consumed DNS Connect source archive"
          git push origin HEAD:main

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/dns-connect-release.jks"
