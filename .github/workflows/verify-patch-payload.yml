name: Verify DNS Connect 2.3.0 rebuild patch

on:
  push:
    branches:
      - "patch-verify/**"

permissions:
  contents: read

jobs:
  verify-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify every stored patch fragment
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=bootstrap/patch-2.3.0/manifest.json
          COUNT="$(jq -r '.patch.chunkCount' "$MANIFEST")"
          [[ "$COUNT" = "13" ]]
          mkdir -p "$RUNNER_TEMP/patch"
          for index in $(seq 0 12); do
            file="$(printf 'bootstrap/patch-2.3.0/%03d.b64' "$index")"
            expected_length="$(jq -r ".patch.chunks[$index].length" "$MANIFEST")"
            expected_sha="$(jq -r ".patch.chunks[$index].sha256" "$MANIFEST")"
            actual_length="$(wc -c < "$file" | tr -d ' ')"
            [[ "$actual_length" = "$expected_length" ]]
            echo "$expected_sha  $file" | sha256sum --check
            cp "$file" "$RUNNER_TEMP/patch/$(printf '%03d' "$index").b64"
          done

      - name: Reassemble and verify full payload against manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=bootstrap/patch-2.3.0/manifest.json
          EXPECTED_B64_SHA="$(jq -r '.patch.base64Sha256' "$MANIFEST")"
          EXPECTED_GZIP_SHA="$(jq -r '.patch.gzipSha256' "$MANIFEST")"
          EXPECTED_DIFF_SHA="$(jq -r '.patch.diffSha256' "$MANIFEST")"
          EXPECTED_B64_LENGTH="$(jq -r '.patch.base64Length' "$MANIFEST")"
          EXPECTED_GZIP_SIZE="$(jq -r '.patch.gzipSize' "$MANIFEST")"
          EXPECTED_DIFF_SIZE="$(jq -r '.patch.diffSize' "$MANIFEST")"

          cat "$RUNNER_TEMP/patch"/{000..012}.b64 > "$RUNNER_TEMP/patch.b64"
          [[ "$(wc -c < "$RUNNER_TEMP/patch.b64" | tr -d ' ')" = "$EXPECTED_B64_LENGTH" ]]
          echo "$EXPECTED_B64_SHA  $RUNNER_TEMP/patch.b64" | sha256sum --check

          base64 --decode "$RUNNER_TEMP/patch.b64" > "$RUNNER_TEMP/patch.gz"
          [[ "$(wc -c < "$RUNNER_TEMP/patch.gz" | tr -d ' ')" = "$EXPECTED_GZIP_SIZE" ]]
          echo "$EXPECTED_GZIP_SHA  $RUNNER_TEMP/patch.gz" | sha256sum --check
          gzip -t "$RUNNER_TEMP/patch.gz"

          gzip --decompress --stdout "$RUNNER_TEMP/patch.gz" > "$RUNNER_TEMP/DNS-Connect-2.3.0.patch"
          [[ "$(wc -c < "$RUNNER_TEMP/DNS-Connect-2.3.0.patch" | tr -d ' ')" = "$EXPECTED_DIFF_SIZE" ]]
          echo "$EXPECTED_DIFF_SHA  $RUNNER_TEMP/DNS-Connect-2.3.0.patch" | sha256sum --check
          git apply --numstat "$RUNNER_TEMP/DNS-Connect-2.3.0.patch" > "$RUNNER_TEMP/patch-numstat.txt"
          cat "$RUNNER_TEMP/patch-numstat.txt"

      - name: Publish verified patch reconstruction as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dns-connect-2.3.0-verified-patch
          path: |
            ${{ runner.temp }}/patch.gz
            ${{ runner.temp }}/DNS-Connect-2.3.0.patch
            ${{ runner.temp }}/patch-numstat.txt
          if-no-files-found: error
          retention-days: 30
