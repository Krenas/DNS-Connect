name: Verify DNS Connect 2.3.0 rebuild patch

on:
  push:
    branches:
      - main
      - "patch-verify/**"
    paths:
      - ".github/workflows/**"
      - "bootstrap/patch-2.3.0/**"
      - "bootstrap/rebuild-dns-connect-from-project-files.sh"

permissions:
  contents: read

jobs:
  verify-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go for actionlint
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Lint all GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml

      - name: Verify every stored patch fragment
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=bootstrap/patch-2.3.0/manifest.json
          COUNT="$(jq -r '.patch.chunkCount' "$MANIFEST")"
          [[ "$COUNT" = "13" ]]
          mkdir -p "$RUNNER_TEMP/patch"
          for index in $(seq 0 12); do
            file="$(printf 'bootstrap/patch-2.3.0/%03d.b64' "$index")"
            expected_length="$(jq -r ".patch.chunks[$index].length" "$MANIFEST")"
            expected_sha="$(jq -r ".patch.chunks[$index].sha256" "$MANIFEST")"
            actual_length="$(wc -c < "$file" | tr -d ' ')"
            [[ "$actual_length" = "$expected_length" ]]
            echo "$expected_sha  $file" | sha256sum --check
            cp "$file" "$RUNNER_TEMP/patch/$(printf '%03d' "$index").b64"
          done

      - name: Reassemble and verify full payload against manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=bootstrap/patch-2.3.0/manifest.json
          EXPECTED_B64_SHA="$(jq -r '.patch.base64Sha256' "$MANIFEST")"
          EXPECTED_GZIP_SHA="$(jq -r '.patch.gzipSha256' "$MANIFEST")"
          EXPECTED_DIFF_SHA="$(jq -r '.patch.diffSha256' "$MANIFEST")"
          EXPECTED_B64_LENGTH="$(jq -r '.patch.base64Length' "$MANIFEST")"
          EXPECTED_GZIP_SIZE="$(jq -r '.patch.gzipSize' "$MANIFEST")"
          EXPECTED_DIFF_SIZE="$(jq -r '.patch.diffSize' "$MANIFEST")"

          cat "$RUNNER_TEMP/patch"/{000..012}.b64 > "$RUNNER_TEMP/patch.b64"
          [[ "$(wc -c < "$RUNNER_TEMP/patch.b64" | tr -d ' ')" = "$EXPECTED_B64_LENGTH" ]]
          echo "$EXPECTED_B64_SHA  $RUNNER_TEMP/patch.b64" | sha256sum --check

          base64 --decode "$RUNNER_TEMP/patch.b64" > "$RUNNER_TEMP/patch.gz"
          [[ "$(wc -c < "$RUNNER_TEMP/patch.gz" | tr -d ' ')" = "$EXPECTED_GZIP_SIZE" ]]
          echo "$EXPECTED_GZIP_SHA  $RUNNER_TEMP/patch.gz" | sha256sum --check
          gzip -t "$RUNNER_TEMP/patch.gz"

          gzip --decompress --stdout "$RUNNER_TEMP/patch.gz" > "$RUNNER_TEMP/DNS-Connect-2.3.0.patch"
          [[ "$(wc -c < "$RUNNER_TEMP/DNS-Connect-2.3.0.patch" | tr -d ' ')" = "$EXPECTED_DIFF_SIZE" ]]
          echo "$EXPECTED_DIFF_SHA  $RUNNER_TEMP/DNS-Connect-2.3.0.patch" | sha256sum --check
          git apply --numstat "$RUNNER_TEMP/DNS-Connect-2.3.0.patch" > "$RUNNER_TEMP/patch-numstat.txt"
          cat "$RUNNER_TEMP/patch-numstat.txt"

      - name: Verify the supplemental three-server monochrome branding patch
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=bootstrap/patch-2.3.0/manifest.json
          PATCH=bootstrap/patch-2.3.0/branding-3server-monochrome.patch
          EXPECTED_SIZE="$(jq -r '.supplementalPatches[0].size' "$MANIFEST")"
          EXPECTED_SHA="$(jq -r '.supplementalPatches[0].sha256' "$MANIFEST")"
          [[ "$(wc -c < "$PATCH" | tr -d ' ')" = "$EXPECTED_SIZE" ]]
          echo "$EXPECTED_SHA  $PATCH" | sha256sum --check
          git apply --numstat "$PATCH"

          # Recreate the original monochrome launcher resource extracted from 2.1.0
          # to prove that the supplemental hunk applies cleanly with zero fuzz.
          mkdir -p "$RUNNER_TEMP/branding-fixture/app/src/main/res/drawable"
          cat > "$RUNNER_TEMP/branding-fixture/app/src/main/res/drawable/ic_launcher_monochrome.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="4.5"
                  android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M54,12 C77,12 95,30 95,53 C95,76 77,94 54,94 C31,94 13,76 13,53 C13,30 31,12 54,12 Z" />
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="3.5"
                  android:strokeLineCap="round" android:pathData="M54,13 C42,24 36,38 36,53 C36,68 42,82 54,93 M54,13 C66,24 72,38 72,53 C72,68 66,82 54,93 M16,43 C28,49 40,52 54,52 C68,52 80,49 92,43 M18,66 C30,61 42,59 54,59 C66,59 78,61 90,66" />
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="4.5"
                  android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M54,27 C75,34 87,44 91,57 C86,74 72,86 54,93 C36,86 22,74 17,57 C21,44 33,34 54,27 Z" />
              <path android:fillColor="#FFFFFFFF" android:pathData="M34,48 H74 V54 H34 Z M34,59 H74 V65 H34 Z" />
              <path android:fillColor="#FFFFFFFF" android:pathData="M41,75 L49,83 L68,64 L73,69 L49,93 L36,80 Z" />
          </vector>
          XML
          mkdir -p "$RUNNER_TEMP/branding-fixture/tests"
          {
            for _ in $(seq 1 245); do echo; done
            cat <<'TEST'
            && grep -q 'android:maxLines="1" android:ellipsize="end"' "$ROOT/app/src/main/res/layout/widget_dns_quick_actions.xml" \
            && pass 'quick-actions widget uses compact labels and ellipsizes long text instead of overflowing' \
            || fail 'quick-actions widget compact labels may be clipped'
          grep -q 'android:pathData="M54,12' "$ROOT/app/src/main/res/drawable/ic_launcher_monochrome.xml" \
            && grep -q 'M34,48 H74' "$ROOT/app/src/main/res/drawable/ic_launcher_monochrome.xml" \
            && pass 'adaptive monochrome icon uses the same globe, server and verification motif as the launcher icon' \
            || fail 'adaptive monochrome icon is inconsistent with the new app identity'
          grep -q 'setMinHeight(dp(52))' "$MAIN" \
            && ! grep -q 'new LayoutParams(0, dp(50)' "$MAIN" \
            && ! grep -q 'marginParams(LayoutParams.MATCH_PARENT, dp(50)' "$MAIN" \
          TEST
          } > "$RUNNER_TEMP/branding-fixture/tests/verify-ui.sh"
          patch --batch --forward --fuzz=0 -p1 -d "$RUNNER_TEMP/branding-fixture" --dry-run < "$PATCH"
          patch --batch --forward --fuzz=0 -p1 -d "$RUNNER_TEMP/branding-fixture" < "$PATCH"
          grep -Fq 'M29,17 H79' "$RUNNER_TEMP/branding-fixture/app/src/main/res/drawable/ic_launcher_monochrome.xml"
          grep -Fq 'M35,25 m-2.5,0' "$RUNNER_TEMP/branding-fixture/app/src/main/res/drawable/ic_launcher_monochrome.xml"
          grep -Fq 'M44,25 H72 M44,51 H72 M44,77 H72' "$RUNNER_TEMP/branding-fixture/app/src/main/res/drawable/ic_launcher_monochrome.xml"
          grep -Fq "Android 13+ monochrome launcher icon matches the three-server app mark" "$RUNNER_TEMP/branding-fixture/tests/verify-ui.sh"
          grep -Fq 'M29,17 H79' "$RUNNER_TEMP/branding-fixture/app/src/main/res/drawable/ic_launcher_monochrome.xml"
          grep -Fq 'M35,25 m-2.5,0' "$RUNNER_TEMP/branding-fixture/app/src/main/res/drawable/ic_launcher_monochrome.xml"
          grep -Fq 'M44,25 H72 M44,51 H72 M44,77 H72' "$RUNNER_TEMP/branding-fixture/app/src/main/res/drawable/ic_launcher_monochrome.xml"

          bash -n bootstrap/rebuild-dns-connect-from-project-files.sh

      - name: Publish verified patch reconstruction as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dns-connect-2.3.0-verified-patch
          path: |
            ${{ runner.temp }}/patch.gz
            ${{ runner.temp }}/DNS-Connect-2.3.0.patch
            ${{ runner.temp }}/patch-numstat.txt
          if-no-files-found: error
          retention-days: 30
