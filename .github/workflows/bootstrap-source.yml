name: Bootstrap DNS Connect source from 2.2.x release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published release tag containing APK and source ZIP, e.g. v2.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: dns-connect-source-bootstrap
  cancel-in-progress: false

jobs:
  import-source:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Android build tools
        uses: android-actions/setup-android@v3

      - name: Download and verify published APK and source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_CERT_SHA256: 54b847350b8f4166ea3add400330f360cbc53c4b82e53d709d2c9ff084eb21f7
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "build-tools;35.0.0"
          [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || {
            echo "Tag must be vMAJOR.MINOR.PATCH." >&2
            exit 1
          }
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          APK_NAME="DNS-Connect-$VERSION-release.apk"
          SOURCE_NAME="DNS-Connect-$VERSION-source.zip"
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$APK_NAME" --pattern "$SOURCE_NAME" --dir "$RUNNER_TEMP/assets"
          APK="$RUNNER_TEMP/assets/$APK_NAME"
          SOURCE_ZIP="$RUNNER_TEMP/assets/$SOURCE_NAME"
          test -s "$APK"
          test -s "$SOURCE_ZIP"
          unzip -tq "$SOURCE_ZIP" >/dev/null
          unzip -Z1 "$SOURCE_ZIP" > "$RUNNER_TEMP/source-files.txt"

          grep -qx 'app/build.gradle.kts' "$RUNNER_TEMP/source-files.txt"
          grep -qx 'settings.gradle.kts' "$RUNNER_TEMP/source-files.txt"
          grep -qx 'gradle/wrapper/gradle-wrapper.jar' "$RUNNER_TEMP/source-files.txt"
          grep -qx 'app/src/main/AndroidManifest.xml' "$RUNNER_TEMP/source-files.txt"
          if grep -Eq '(^/|(^|/)\.\.(/|$))' "$RUNNER_TEMP/source-files.txt"; then
            echo "Unsafe path found in source ZIP." >&2
            exit 1
          fi
          if grep -Eiq '\.(jks|keystore|p12|pfx|pem|pk8)$|(^|/)[^/]*password[^/]*$' "$RUNNER_TEMP/source-files.txt"; then
            echo "Signing material or password file found in source ZIP." >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/source"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/source"
          SOURCE_VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$RUNNER_TEMP/source/app/build.gradle.kts" | head -n1)"
          SOURCE_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$RUNNER_TEMP/source/app/build.gradle.kts" | head -n1)"
          SOURCE_PACKAGE="$(sed -nE 's/^[[:space:]]*applicationId[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$RUNNER_TEMP/source/app/build.gradle.kts" | head -n1)"
          [ "$SOURCE_VERSION" = "$VERSION" ]
          [ "$SOURCE_PACKAGE" = "ru.krenas.dnsanalytics" ]

          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          PACKAGE="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n1)"
          APK_VERSION="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n1)"
          VERSION_CODE="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n1)"
          [ "$PACKAGE" = "ru.krenas.dnsanalytics" ]
          [ "$APK_VERSION" = "$VERSION" ]
          [ "$SOURCE_CODE" = "$VERSION_CODE" ]
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] && [ "$VERSION_CODE" -gt 0 ]

          SIGNATURE="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK")"
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: *//p' <<< "$SIGNATURE" | head -n1 | tr '[:upper:]' '[:lower:]')"
          [ "$CERT" = "$EXPECTED_CERT_SHA256" ] || {
            echo "APK signer is not the preserved 2.2.x certificate." >&2
            exit 1
          }

          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SOURCE_SHA256="$(sha256sum "$SOURCE_ZIP" | awk '{print $1}')"
          APK_SIZE="$(wc -c < "$APK" | tr -d ' ')"
          SOURCE_SIZE="$(wc -c < "$SOURCE_ZIP" | tr -d ' ')"
          [ "$APK_SIZE" -gt 0 ] && [ "$APK_SIZE" -le 104857600 ]
          [ "$SOURCE_SIZE" -gt 0 ] && [ "$SOURCE_SIZE" -le 52428800 ]

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          jq -e --arg apk "$APK_NAME" --arg src "$SOURCE_NAME" \
            --arg ad "sha256:$APK_SHA256" --arg sd "sha256:$SOURCE_SHA256" \
            --argjson asize "$APK_SIZE" --argjson ssize "$SOURCE_SIZE" '
            .draft == false and .prerelease == false and
            ([.assets[] | select(.name == $apk and .state == "uploaded" and .digest == $ad and .size == $asize)] | length == 1) and
            ([.assets[] | select(.name == $src and .state == "uploaded" and .digest == $sd and .size == $ssize)] | length == 1)
          ' "$RUNNER_TEMP/release.json"

          CURRENT="$(curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/latest.json")"
          CURRENT_VERSION="$(jq -r '.version // "0.0.0"' <<< "$CURRENT")"
          CURRENT_CODE="$(jq -r '.versionCode // 0' <<< "$CURRENT")"
          dpkg --compare-versions "$VERSION" gt "$CURRENT_VERSION"
          [ "$VERSION_CODE" -gt "$CURRENT_CODE" ]

          {
            echo "VERSION=$VERSION"
            echo "TAG=$RELEASE_TAG"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "APK_SHA256=$APK_SHA256"
            echo "SOURCE_SHA256=$SOURCE_SHA256"
            echo "APK_SIZE=$APK_SIZE"
            echo "SOURCE_SIZE=$SOURCE_SIZE"
            echo "APK_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$APK_NAME"
            echo "SOURCE_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$SOURCE_NAME"
            echo "RELEASE_URL=https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
            echo "SOURCE_ROOT=$RUNNER_TEMP/source"
          } >> "$GITHUB_ENV"

      - name: Import source code and publish latest.json
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' \
            --exclude='HANDOFF.md' --exclude='README.md' \
            "$SOURCE_ROOT/" "$GITHUB_WORKSPACE/"
          chmod +x ./gradlew

          jq -n \
            --arg version "$VERSION" --arg tag "$TAG" \
            --arg apk "$APK_URL" --arg sha256 "$APK_SHA256" \
            --arg source "$SOURCE_URL" --arg sourceSha256 "$SOURCE_SHA256" \
            --arg release "$RELEASE_URL" --arg notes "Initial verified source import for DNS Connect $VERSION" \
            --argjson versionCode "$VERSION_CODE" --argjson size "$APK_SIZE" --argjson sourceSize "$SOURCE_SIZE" \
            '{version:$version,tag:$tag,versionCode:$versionCode,apk:$apk,sha256:$sha256,size:$size,sourceArchive:$source,sourceSha256:$sourceSha256,sourceSize:$sourceSize,release:$release,notes:$notes}' \
            > latest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import DNS Connect $VERSION source and updater manifest"
          git push origin HEAD:main

      - name: Verify public repository and updater manifest
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/latest.json?check=$attempt" -o latest-public.json && \
              jq -e --arg v "$VERSION" --arg t "$TAG" --arg apk "$APK_SHA256" --arg src "$SOURCE_URL" \
                '.version == $v and .tag == $t and .sha256 == $apk and .sourceArchive == $src and .versionCode > 0' \
                latest-public.json >/dev/null; then
              test -s app/build.gradle.kts
              test -s app/src/main/AndroidManifest.xml
              echo "Source import and updater manifest verified."
              exit 0
            fi
            sleep 5
          done
          echo "The imported source or public manifest was not verified." >&2
          exit 1
