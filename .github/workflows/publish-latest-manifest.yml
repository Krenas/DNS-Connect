name: Verify release assets, import source and publish latest.json

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: dns-connect-latest-manifest
  cancel-in-progress: false

jobs:
  update-manifest-and-source:
    if: github.event.release.prerelease == false && github.event.release.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Android build tools
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager --install "build-tools;35.0.0"

      - name: Validate APK and source archive
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXPECTED_CERT_SHA256: 4dc48085b7ea161b57e6266611c5d6a28514df6f2ddfc26df14f3ac972debf90
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || {
            echo "Stable release tag must have the form vMAJOR.MINOR.PATCH." >&2; exit 1;
          }
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          APK_NAME="DNS-Connect-$VERSION-release.apk"
          SOURCE_NAME="DNS-Connect-$VERSION-source.zip"
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$APK_NAME" --pattern "$SOURCE_NAME" --dir "$RUNNER_TEMP/release-assets"
          APK="$RUNNER_TEMP/release-assets/$APK_NAME"
          SOURCE_ZIP="$RUNNER_TEMP/release-assets/$SOURCE_NAME"
          test -s "$APK" && test -s "$SOURCE_ZIP"
          unzip -tq "$SOURCE_ZIP" >/dev/null
          unzip -Z1 "$SOURCE_ZIP" > "$RUNNER_TEMP/source-files.txt"
          if grep -Eq '(^/|(^|/)\.\.(/|$))' "$RUNNER_TEMP/source-files.txt"; then
            echo "Unsafe path found in source archive." >&2; exit 1;
          fi
          grep -qx 'app/build.gradle.kts' "$RUNNER_TEMP/source-files.txt"
          grep -qx 'settings.gradle.kts' "$RUNNER_TEMP/source-files.txt"
          grep -qx 'gradle/wrapper/gradle-wrapper.jar' "$RUNNER_TEMP/source-files.txt"
          SOURCE_ROOT="$RUNNER_TEMP/source-tree"
          mkdir -p "$SOURCE_ROOT"
          unzip -q "$SOURCE_ZIP" -d "$SOURCE_ROOT"
          SOURCE_VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$SOURCE_ROOT/app/build.gradle.kts" | head -n1)"
          [ "$SOURCE_VERSION" = "$VERSION" ] || {
            echo "Source archive version does not match release tag." >&2; exit 1;
          }

          BADGING="$ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK""
          PACKAGE="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n1)"
          APK_VERSION="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n1)"
          VERSION_CODE="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -n1)"
          [ "$PACKAGE" = "ru.krenas.dnsanalytics" ]
          [ "$APK_VERSION" = "$VERSION" ]
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] && [ "$VERSION_CODE" -gt 0 ]
          SIGNATURE="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK")"
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: *//p' <<< "$SIGNATURE" | head -n1 | tr '[:upper:]' '[:lower:]')"
          [ "$CERT" = "$EXPECTED_CERT_SHA256" ] || {
            echo "APK signing certificate does not match the preserved DNS Connect 2.2.x key." >&2; exit 1;
          }
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SOURCE_SHA256="$(sha256sum "$SOURCE_ZIP" | awk '{print $1}')"
          APK_SIZE="$(wc -c < "$APK" | tr -d ' ')"
          SOURCE_SIZE="$(wc -c < "$SOURCE_ZIP" | tr -d ' ')"
          [ "$APK_SIZE" -gt 0 ] && [ "$APK_SIZE" -le 104857600 ]
          [ "$SOURCE_SIZE" -gt 0 ] && [ "$SOURCE_SIZE" -le 52428800 ]

          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          jq -e --arg apk "$APK_NAME" --arg source "$SOURCE_NAME" \
            --arg apk_digest "sha256:$APK_SHA256" --arg source_digest "sha256:$SOURCE_SHA256" \
            --argjson apk_size "$APK_SIZE" --argjson source_size "$SOURCE_SIZE" '
            [.assets[] | select(.name == $apk and .state == "uploaded" and .digest == $apk_digest and .size == $apk_size)] | length == 1
          ' <<< "$RELEASE_JSON" >/dev/null
          jq -e --arg source "$SOURCE_NAME" --arg source_digest "sha256:$SOURCE_SHA256" \
            --argjson source_size "$SOURCE_SIZE" '
            [.assets[] | select(.name == $source and .state == "uploaded" and .digest == $source_digest and .size == $source_size)] | length == 1
          ' <<< "$RELEASE_JSON" >/dev/null

          {
            echo "VERSION=$VERSION"
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "APK_SHA256=$APK_SHA256"
            echo "SOURCE_SHA256=$SOURCE_SHA256"
            echo "APK_SIZE=$APK_SIZE"
            echo "SOURCE_SIZE=$SOURCE_SIZE"
            echo "APK_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$APK_NAME"
            echo "SOURCE_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$SOURCE_NAME"
            echo "RELEASE_URL=https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          } >> "$GITHUB_ENV"
          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"

      - name: Import the exact released source snapshot into main
        env:
          RELEASE_NOTES: ${{ github.event.release.body }}
        shell: bash
        run: |
          set -euo pipefail
          # Preserve repository-owned automation. The source archive contains project code,
          # Gradle wrapper, tests, README and changelog, but intentionally no .github folder.
          rsync -a --exclude='.github/' "$SOURCE_ROOT/" "$GITHUB_WORKSPACE/"
          jq -n \
            --arg version "$VERSION" --arg tag "$RELEASE_TAG" \
            --arg apk "$APK_URL" --arg sha256 "$APK_SHA256" \
            --arg source "$SOURCE_URL" --arg sourceSha256 "$SOURCE_SHA256" \
            --arg release "$RELEASE_URL" --arg notes "$RELEASE_NOTES" \
            --argjson versionCode "$VERSION_CODE" --argjson size "$APK_SIZE" --argjson sourceSize "$SOURCE_SIZE" \
            '{version:$version,tag:$tag,versionCode:$versionCode,apk:$apk,sha256:$sha256,size:$size,sourceArchive:$source,sourceSha256:$sourceSha256,sourceSize:$sourceSize,release:$release,notes:$notes}' \
            > latest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import DNS Connect $VERSION source and update release manifest"
            git push origin HEAD:main
          fi

      - name: Confirm public source tree and update manifest
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/latest.json?check=$attempt" -o latest-public.json && \
               jq -e --arg version "$VERSION" --arg tag "$RELEASE_TAG" \
                 --arg sha "$APK_SHA256" --arg source "$SOURCE_URL" \
                 '.version == $version and .tag == $tag and .sha256 == $sha and .sourceArchive == $source and .versionCode > 0' \
                 latest-public.json >/dev/null; then
              test -s app/build.gradle.kts
              test -s app/src/main/AndroidManifest.xml
              echo "Public latest.json and imported source tree verified."
              exit 0
            fi
            sleep 5
          done
          echo "Public manifest/source verification failed." >&2
          exit 1
