name: Inspect the original Services icon from the 2.1.0 APK

on:
  push:
    branches: ["inspect/legacy-service-icon"]
    paths:
      - ".github/workflows/inspect-legacy-service-icon.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download the published 2.1.0 APK through the Release Assets API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk"
          gh api \
            --header "Accept: application/octet-stream" \
            /repos/Krenas/DNS-Connect/releases/assets/721365703 \
            > "$RUNNER_TEMP/apk/DNS-Connect-2.1.0-release.apk"
          test -s "$RUNNER_TEMP/apk/DNS-Connect-2.1.0-release.apk"
          echo "c05e9cb8af2b4193ba2c77fb29bcb889e7588af4e61825af34c92af900c09755  $RUNNER_TEMP/apk/DNS-Connect-2.1.0-release.apk" | sha256sum --check

      - name: Install JADX CLI through the GitHub Release Assets API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --header "Accept: application/octet-stream" \
            /repos/skylot/jadx/releases/assets/472797042 \
            > "$RUNNER_TEMP/jadx.zip"
          test -s "$RUNNER_TEMP/jadx.zip"
          mkdir -p "$RUNNER_TEMP/jadx"
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          chmod +x "$RUNNER_TEMP/jadx/bin/jadx"
          "$RUNNER_TEMP/jadx/bin/jadx" --version

      - name: Decompile application sources and resources
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/jadx/bin/jadx" \
            --show-bad-code \
            -d "$RUNNER_TEMP/decompiled" \
            "$RUNNER_TEMP/apk/DNS-Connect-2.1.0-release.apk"

      - name: Locate Services navigation icon and launcher artwork
        shell: bash
        run: |
          set -euo pipefail
          DECOMPILED="$RUNNER_TEMP/decompiled" python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["DECOMPILED"])
          source_root = root / "sources"
          resource_root = root / "resources" / "res"
          candidates = list(source_root.rglob("MainActivity.java"))
          print("=== MAINACTIVITY LOCATOR ===")
          if not candidates:
              print("MainActivity.java not found")
          for path in candidates:
              lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
              print(f"FILE: {path.relative_to(source_root)}; {len(lines)} lines")
              pattern = re.compile(r"Сервис|Services|server|draw|icon|glyph|symbol|Canvas|Path|Drawable|Bitmap", re.I)
              hits = [i for i, line in enumerate(lines) if pattern.search(line)]
              selected = set()
              for i in hits:
                  selected.update(range(max(0, i-5), min(len(lines), i+9)))
              for i in sorted(selected):
                  print(f"{i+1}: {lines[i][:300]}")
          print("=== ALL MIPMAP DENSITIES AND LAUNCHER RESOURCES ===")
          for base in sorted(resource_root.glob("mipmap*")):
              if base.is_dir():
                  for path in sorted(base.rglob("*")):
                      if path.is_file():
                          print(f"{path.relative_to(resource_root)} ({path.stat().st_size} bytes)")
                          if path.suffix == ".xml":
                              print("--- XML CONTENT START ---")
                              print(path.read_text(encoding="utf-8", errors="replace")[:10000])
                              print("--- XML CONTENT END ---")
          print("=== DRAWABLE BRAND AND FUNCTIONAL RESOURCES ===")
          for base in sorted(resource_root.glob("drawable*")):
              if base.is_dir():
                  for path in sorted(base.rglob("*")):
                      if path.is_file() and re.search(r"(server|service|dns|launcher|icon)", path.name, re.I):
                          print(f"{path.relative_to(resource_root)} ({path.stat().st_size} bytes)")
          print("=== MANIFEST ICON ATTRIBUTES ===")
          for path in root.rglob("AndroidManifest.xml"):
              data = path.read_text(encoding="utf-8", errors="replace")
              if "android:icon" in data or "android:roundIcon" in data:
                  print(path.relative_to(root))
                  for line in data.splitlines():
                      if "android:icon" in line or "android:roundIcon" in line:
                          print(line.strip())
          print("=== NAVIGATION LABEL REFERENCES ===")
          for base in (source_root, root / "resources" / "res" / "values"):
              if base.exists():
                  for path in base.rglob("*"):
                      if path.is_file() and path.suffix in (".java", ".xml"):
                          data = path.read_text(encoding="utf-8", errors="replace")
                          if "Сервисы" in data or "Services" in data:
                              print(f"{path.relative_to(root)}")
                              for n, line in enumerate(data.splitlines(), 1):
                                  if "Сервисы" in line or "Services" in line:
                                      print(f"{n}: {line[:260]}")
          PY
      - name: Save decompiled icon audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dns-connect-2.1.0-services-icon-audit
          path: |
            ${{ runner.temp }}/decompiled/resources/res/drawable*
            ${{ runner.temp }}/decompiled/sources/ru/krenas/dnsanalytics
          if-no-files-found: warn
          retention-days: 7
