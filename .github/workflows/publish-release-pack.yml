name: Publish verified DNS Connect release pack

on:
  push:
    branches: [main]
    paths:
      - "incoming/drop/DNS-Connect-*-release-pack.zip"
      - "incoming/drop/README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dns-connect-release-pack
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Android verification tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          SDK_STATUS="${PIPESTATUS[1]}"
          set -o pipefail
          [[ "$SDK_STATUS" == "0" ]]
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Validate release pack
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dns-connect"
          mapfile -t packs < <(find incoming/drop -maxdepth 1 -type f -name 'DNS-Connect-*-release-pack.zip' -print | sort)
          count="$(find incoming/drop -maxdepth 1 -type f -name 'DNS-Connect-*-release-pack.zip' | wc -l | tr -d ' ')"
          if [[ "$count" == "0" ]]; then
            echo "No release pack found; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$count" == "1" ]] || { echo "Upload exactly one release pack at a time." >&2; exit 1; }
          PACK="${packs[0]}"
          unzip -tq "$PACK" >/dev/null
          unzip -q "$PACK" -d "$RUNNER_TEMP/dns-connect"

          mapfile -t apk_files < <(find "$RUNNER_TEMP/dns-connect" -type f -name 'DNS-Connect-*-release.apk' -print | sort)
          mapfile -t source_files < <(find "$RUNNER_TEMP/dns-connect" -type f -name 'DNS-Connect-*-source.zip' -print | sort)
          mapfile -t qa_files < <(find "$RUNNER_TEMP/dns-connect" -type f -name 'DNS-Connect-*-QA.md' -print | sort)
          [[ "${#apk_files[@]}" == "1" && "${#source_files[@]}" == "1" && "${#qa_files[@]}" == "1" ]] || {
            echo "Release pack must contain exactly one APK, one source ZIP and one QA report." >&2
            exit 1
          }

          APK_PATH="${apk_files[0]}"
          SOURCE_PATH="${source_files[0]}"
          QA_PATH="${qa_files[0]}"
          APK="$(basename "$APK_PATH")"
          SOURCE="$(basename "$SOURCE_PATH")"
          QA="$(basename "$QA_PATH")"
          VERSION="${APK#DNS-Connect-}"
          VERSION="${VERSION%-release.apk}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "APK filename does not contain a semantic version." >&2
            exit 1
          }
          TAG="v$VERSION"
          EXPECTED_PACKAGE="ru.krenas.dnsanalytics"
          EXPECTED_SIGNER="54b847350b8f4166ea3add400330f360cbc53c4b82e53d709d2c9ff084eb21f7"

          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK_PATH")"
          read -r APK_PACKAGE VERSION_CODE APK_VERSION < <(awk -F "'" '/^package:/ { print $2, $4, $6; exit }' <<< "$BADGING")
          [[ "$APK_PACKAGE" == "$EXPECTED_PACKAGE" && "$APK_VERSION" == "$VERSION" ]]
          [[ "$VERSION_CODE" =~ ^[0-9]+$ && "$VERSION_CODE" -gt 0 ]]

          SIGNATURE="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_PATH")"
          CERT="$(awk '/^Signer #1 certificate SHA-256 digest:/ { sub(/^Signer #1 certificate SHA-256 digest:[[:space:]]*/, ""); print tolower($0); exit }' <<< "$SIGNATURE")"
          [[ "$CERT" == "$EXPECTED_SIGNER" ]]
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$SIGNATURE"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' <<< "$SIGNATURE"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK_PATH" >/dev/null

          APK_SHA="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          SOURCE_SHA="$(sha256sum "$SOURCE_PATH" | awk '{print $1}')"
          APK_SIZE="$(wc -c < "$APK_PATH" | tr -d ' ')"
          SOURCE_SIZE="$(wc -c < "$SOURCE_PATH" | tr -d ' ')"
          [[ "$APK_SIZE" -gt 0 && "$APK_SIZE" -le 104857600 ]]
          [[ "$SOURCE_SIZE" -gt 0 && "$SOURCE_SIZE" -le 52428800 ]]
          unzip -tq "$SOURCE_PATH" >/dev/null

          SOURCE_DIR="$RUNNER_TEMP/dns-connect/source"
          mkdir -p "$SOURCE_DIR"
          python3 - "$SOURCE_PATH" <<'PY'
          import sys, stat, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = archive.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit("Duplicate source archive paths.")
              for item in archive.infolist():
                  name = item.filename.replace("\\", "/")
                  parts = [part for part in name.split("/") if part]
                  if name.startswith("/") or any(part in (".", "..") for part in parts):
                      raise SystemExit(f"Unsafe ZIP path: {item.filename}")
                  if stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit(f"Symlink entry is not allowed: {item.filename}")
                  if item.file_size > 100 * 1024 * 1024:
                      raise SystemExit(f"Unreasonably large ZIP entry: {item.filename}")
              forbidden = (".jks", ".keystore", ".p12", ".pfx", ".pem", ".pk8", ".apk", ".idsig", ".orig", ".rej")
              lower = [name.lower() for name in names]
              if any(name.endswith(forbidden) or "password" in name.split("/")[-1] for name in lower):
                  raise SystemExit("Signing material, APK output or patch debris found in source ZIP.")
              required = {
                  "app/build.gradle.kts",
                  "app/src/main/AndroidManifest.xml",
                  "settings.gradle.kts",
                  "gradle/wrapper/gradle-wrapper.jar",
                  "app/src/main/java/ru/krenas/dnsanalytics/GitHubUpdateManager.java",
              }
              if not required.issubset(set(names)):
                  raise SystemExit("Source ZIP misses a required project or updater file.")
          PY
          unzip -q "$SOURCE_PATH" -d "$SOURCE_DIR"
          SRC_VERSION="$(awk -F '"' '/versionName[[:space:]]*=/ {print $2; exit}' "$SOURCE_DIR/app/build.gradle.kts")"
          SRC_CODE="$(awk -F '=' '/versionCode[[:space:]]*=/ {gsub(/[[:space:]]/, "", $2); print $2; exit}' "$SOURCE_DIR/app/build.gradle.kts")"
          SRC_PACKAGE="$(awk -F '"' '/applicationId[[:space:]]*=/ {print $2; exit}' "$SOURCE_DIR/app/build.gradle.kts")"
          [[ "$SRC_VERSION" == "$VERSION" && "$SRC_CODE" == "$VERSION_CODE" && "$SRC_PACKAGE" == "$EXPECTED_PACKAGE" ]]
          grep -Fq 'Проверить и обновить' "$SOURCE_DIR/app/src/main/java/ru/krenas/dnsanalytics/MainActivity.java"
          grep -Fq 'checkAndInstallLatestUpdate' "$SOURCE_DIR/app/src/main/java/ru/krenas/dnsanalytics/MainActivity.java"
          test -s "$SOURCE_DIR/app/src/main/java/ru/krenas/dnsanalytics/GitHubUpdateManager.java"

          CURRENT="$(curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/latest.json")"
          CURRENT_VERSION="$(jq -r '.version // "0.0.0"' <<< "$CURRENT")"
          CURRENT_CODE="$(jq -r '.versionCode // 0' <<< "$CURRENT")"
          dpkg --compare-versions "$VERSION" gt "$CURRENT_VERSION"
          [[ "$VERSION_CODE" -gt "$CURRENT_CODE" ]]

          cp "$APK_PATH" "$RUNNER_TEMP/dns-connect/$APK"
          cp "$SOURCE_PATH" "$RUNNER_TEMP/dns-connect/$SOURCE"
          cp "$QA_PATH" "$RUNNER_TEMP/dns-connect/$QA"
          CHECKSUMS="$RUNNER_TEMP/dns-connect/SHA256SUMS.txt"
          (cd "$RUNNER_TEMP/dns-connect" && sha256sum "$APK" "$SOURCE" > "$CHECKSUMS")

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "version_code=$VERSION_CODE"
            echo "apk=$APK"
            echo "source=$SOURCE"
            echo "qa=$QA"
            echo "checksums=SHA256SUMS.txt"
            echo "apk_sha=$APK_SHA"
            echo "source_sha=$SOURCE_SHA"
            echo "apk_size=$APK_SIZE"
            echo "source_size=$SOURCE_SIZE"
            echo "signer=$CERT"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"
      - name: Import validated project source
        if: steps.candidate.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          SOURCE_NAME: ${{ steps.candidate.outputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dns-connect/source"
          unzip -q "$RUNNER_TEMP/dns-connect/$SOURCE_NAME" -d "$RUNNER_TEMP/dns-connect/source"
          SRC="$RUNNER_TEMP/dns-connect/source"
          rsync -a --delete "$SRC/app/" "$GITHUB_WORKSPACE/app/"
          rsync -a --delete "$SRC/gradle/" "$GITHUB_WORKSPACE/gradle/"
          rsync -a --delete "$SRC/tests/" "$GITHUB_WORKSPACE/tests/"
          for file in build.gradle.kts gradle.properties gradlew gradlew.bat settings.gradle.kts build-local.sh build-from-project-files.sh prepare-android-sdk.sh package-release.sh CHANGELOG.md; do
            if [[ -f "$SRC/$file" ]]; then cp "$SRC/$file" "$GITHUB_WORKSPACE/$file"; fi
          done
          chmod +x ./gradlew ./build-local.sh ./build-from-project-files.sh ./prepare-android-sdk.sh ./package-release.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app gradle tests build.gradle.kts gradle.properties gradlew gradlew.bat settings.gradle.kts build-local.sh build-from-project-files.sh prepare-android-sdk.sh package-release.sh CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Import DNS Connect $VERSION verified source"
            git push origin HEAD:main
          fi

      - name: Create draft GitHub Release and upload assets
        if: steps.candidate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.candidate.outputs.version }}
          TAG: ${{ steps.candidate.outputs.tag }}
          APK: ${{ steps.candidate.outputs.apk }}
          SOURCE: ${{ steps.candidate.outputs.source }}
          QA: ${{ steps.candidate.outputs.qa }}
          CHECKSUMS: ${{ steps.candidate.outputs.checksums }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target main --draft --title "DNS Connect $VERSION" \
              --notes "DNS Connect $VERSION. Verified APK, source archive and QA report are attached."
          fi
          gh release upload "$TAG" \
            "$RUNNER_TEMP/dns-connect/$APK" \
            "$RUNNER_TEMP/dns-connect/$SOURCE" \
            "$RUNNER_TEMP/dns-connect/$QA" \
            "$RUNNER_TEMP/dns-connect/$CHECKSUMS" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify uploaded assets and publish Release
        if: steps.candidate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.candidate.outputs.apk }}
          SOURCE: ${{ steps.candidate.outputs.source }}
          APK_SHA: ${{ steps.candidate.outputs.apk_sha }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          APK_SIZE: ${{ steps.candidate.outputs.apk_size }}
          SOURCE_SIZE: ${{ steps.candidate.outputs.source_size }}
          TAG: ${{ steps.candidate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/dns-connect/release.json"
          jq -e --arg apk "$APK" --arg src "$SOURCE" \
            --arg ad "sha256:$APK_SHA" --arg sd "sha256:$SOURCE_SHA" \
            --argjson asize "$APK_SIZE" --argjson ssize "$SOURCE_SIZE" '
            ([.assets[] | select(.name == $apk and .state == "uploaded" and .digest == $ad and .size == $asize)] | length == 1) and
            ([.assets[] | select(.name == $src and .state == "uploaded" and .digest == $sd and .size == $ssize)] | length == 1)
          ' "$RUNNER_TEMP/dns-connect/release.json" >/dev/null
          if [[ "$(jq -r '.draft' "$RUNNER_TEMP/dns-connect/release.json")" == "true" ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi

      - name: Publish latest.json after asset verification
        if: steps.candidate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.candidate.outputs.version }}
          TAG: ${{ steps.candidate.outputs.tag }}
          VERSION_CODE: ${{ steps.candidate.outputs.version_code }}
          APK: ${{ steps.candidate.outputs.apk }}
          SOURCE: ${{ steps.candidate.outputs.source }}
          APK_SHA: ${{ steps.candidate.outputs.apk_sha }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          APK_SIZE: ${{ steps.candidate.outputs.apk_size }}
          SOURCE_SIZE: ${{ steps.candidate.outputs.source_size }}
          SIGNER: ${{ steps.candidate.outputs.signer }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK"
          SOURCE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$SOURCE"
          jq -n \
            --arg version "$VERSION" --arg tag "$TAG" \
            --arg apk "$APK_URL" --arg sha "$APK_SHA" \
            --arg source "$SOURCE_URL" --arg sourceSha "$SOURCE_SHA" \
            --arg signerSha "$SIGNER" --arg release "$RELEASE_URL" \
            --arg notes "DNS Connect $VERSION: обновление через одну кнопку; подпись сохранена." \
            --argjson versionCode "$VERSION_CODE" \
            --argjson size "$APK_SIZE" --argjson sourceSize "$SOURCE_SIZE" \
            '{version:$version,tag:$tag,versionCode:$versionCode,apk:$apk,sha256:$sha,size:$size,signerSha256:$signerSha,sourceArchive:$source,sourceSha256:$sourceSha,sourceSize:$sourceSize,release:$release,notes:$notes}' \
            > latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Publish DNS Connect $VERSION updater manifest"
          git push origin HEAD:main
          PACK_PATH="$(find incoming/drop -maxdepth 1 -type f -name 'DNS-Connect-*-release-pack.zip' -print -quit)"
          if [[ -n "$PACK_PATH" ]]; then
            git rm -f "$PACK_PATH"
            git commit -m "chore: remove processed DNS Connect release pack"
            git push origin HEAD:main
          fi
