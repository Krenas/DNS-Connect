name: Inspect DNS Connect 2.3.0 icon and updater patch

on:
  push:
    branches:
      - "patch-verify/icon-assets-audit"
    paths:
      - ".github/workflows/inspect-icon-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble the already checksum-pinned patch
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/patch-2.3.0/{000..012}.b64 > "$RUNNER_TEMP/patch.b64"
          base64 --decode "$RUNNER_TEMP/patch.b64" > "$RUNNER_TEMP/patch.gz"
          gzip -t "$RUNNER_TEMP/patch.gz"
          gzip -dc "$RUNNER_TEMP/patch.gz" > "$RUNNER_TEMP/dns-connect.patch"
          echo "## Patch file map"
          git apply --numstat "$RUNNER_TEMP/dns-connect.patch" | tee "$RUNNER_TEMP/patch-files.txt"
          echo
          echo "## Resource/icon changes"
          if grep -Ei '(^|/)(res|assets)/|icon|drawable|mipmap|launcher' "$RUNNER_TEMP/patch-files.txt"; then
            :
          else
            echo "No icon, drawable, mipmap, or asset files are changed by the patch."
          fi
          awk '
            /^diff --git / {
              if (active) exit
              active = ($0 ~ /MainActivity\.java/)
            }
            active { print }
          ' "$RUNNER_TEMP/dns-connect.patch" > "$RUNNER_TEMP/MainActivity.patch"
          awk '
            /^diff --git / {
              if (active) exit
              active = ($0 ~ /GitHubUpdateManager\.java/)
            }
            active { print }
          ' "$RUNNER_TEMP/dns-connect.patch" > "$RUNNER_TEMP/GitHubUpdateManager.patch"
          echo
          echo "## MainActivity patch (first 400 lines)"
          head -n 400 "$RUNNER_TEMP/MainActivity.patch" | tee "$RUNNER_TEMP/mainactivity-review.txt"
          echo
          echo "## GitHubUpdateManager patch"
          cat "$RUNNER_TEMP/GitHubUpdateManager.patch" | tee "$RUNNER_TEMP/updater-review.txt"

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: dns-connect-2.3.0-icon-updater-inspection
          path: |
            ${{ runner.temp }}/patch-files.txt
            ${{ runner.temp }}/MainActivity.patch
            ${{ runner.temp }}/GitHubUpdateManager.patch
            ${{ runner.temp }}/mainactivity-review.txt
            ${{ runner.temp }}/updater-review.txt
          if-no-files-found: error
          retention-days: 7
