name: Inspect DNS Connect 2.3.0 icon and updater patch

on:
  push:
    branches:
      - "patch-verify/icon-assets-audit"
    paths:
      - ".github/workflows/inspect-icon-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble the already checksum-pinned patch
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/patch-2.3.0/{000..012}.b64 > "$RUNNER_TEMP/patch.b64"
          base64 --decode "$RUNNER_TEMP/patch.b64" > "$RUNNER_TEMP/patch.gz"
          gzip -t "$RUNNER_TEMP/patch.gz"
          gzip -dc "$RUNNER_TEMP/patch.gz" > "$RUNNER_TEMP/dns-connect.patch"
          echo "## Patch file map" >> "$GITHUB_STEP_SUMMARY"
          git apply --numstat "$RUNNER_TEMP/dns-connect.patch" | tee "$RUNNER_TEMP/patch-files.txt" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "## Resource/icon changes" >> "$GITHUB_STEP_SUMMARY"
          if grep -Ei '(^|/)(res|assets)/|icon|drawable|mipmap|launcher' "$RUNNER_TEMP/patch-files.txt"; then
            grep -Ei '(^|/)(res|assets)/|icon|drawable|mipmap|launcher' "$RUNNER_TEMP/patch-files.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No icon, drawable, mipmap, or asset files are changed by the patch." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          awk '
            /^diff --git / {
              if (active) exit
              active = ($0 ~ /app\/src\/main\/java\/ru\/krenas\/dnsanalytics\/MainActivity\.java$/)
            }
            active { print }
          ' "$RUNNER_TEMP/dns-connect.patch" > "$RUNNER_TEMP/MainActivity.patch"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "## MainActivity patch excerpt (updater, branding, Services references)" >> "$GITHUB_STEP_SUMMARY"
          grep -inE -C 3 'service|server|logo|icon|drawable|app.?icon|launcher|update' "$RUNNER_TEMP/MainActivity.patch" | head -n 240 | tee "$RUNNER_TEMP/mainactivity-review.txt" >> "$GITHUB_STEP_SUMMARY" || true
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Full MainActivity patch is attached as an artifact for later review." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: dns-connect-2.3.0-icon-updater-inspection
          path: |
            ${{ runner.temp }}/patch-files.txt
            ${{ runner.temp }}/MainActivity.patch
            ${{ runner.temp }}/mainactivity-review.txt
          if-no-files-found: error
          retention-days: 7
