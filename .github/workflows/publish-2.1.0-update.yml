name: Publish DNS Connect 2.1.0 for in-app updates

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-2.1.0-update.yml

permissions:
  contents: write

concurrency:
  group: publish-dns-connect-2-1-0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the uploaded APK from the existing 2.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download 2.1.0 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "DNS-Connect-2.1.0-release.apk" \
            --dir dist
          test -s dist/DNS-Connect-2.1.0-release.apk

      - name: Verify the exact APK before publishing
        run: |
          set -euo pipefail
          echo "c05e9cb8af2b4193ba2c77fb29bcb889e7588af4e61825af34c92af900c09755  dist/DNS-Connect-2.1.0-release.apk" | sha256sum --check
          test "$(stat -c %s dist/DNS-Connect-2.1.0-release.apk)" = "1189944"

      - name: Attach the APK to the v2.1.0 release used by the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v2.1.0 dist/DNS-Connect-2.1.0-release.apk \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Verify the published GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v2.1.0" > release.json
          jq -e '
            .draft == false and
            .prerelease == false and
            .tag_name == "v2.1.0" and
            any(.assets[];
              .name == "DNS-Connect-2.1.0-release.apk" and
              .state == "uploaded" and
              .size == 1189944 and
              .digest == "sha256:c05e9cb8af2b4193ba2c77fb29bcb889e7588af4e61825af34c92af900c09755" and
              .browser_download_url == "https://github.com/Krenas/DNS-Connect/releases/download/v2.1.0/DNS-Connect-2.1.0-release.apk"
            )
          ' release.json

      - name: Publish latest.json only after the APK is verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n \
            --arg version "2.1.0" \
            --arg tag "v2.1.0" \
            --arg apk "https://github.com/Krenas/DNS-Connect/releases/download/v2.1.0/DNS-Connect-2.1.0-release.apk" \
            --arg sha256 "c05e9cb8af2b4193ba2c77fb29bcb889e7588af4e61825af34c92af900c09755" \
            --arg release "https://github.com/Krenas/DNS-Connect/releases/tag/v2.1.0" \
            --arg notes "DNS Connect 2.1.0: исправлена подсветка вкладки Сеть; усилена проверка обновления; исправлены метаданные релиза." \
            --argjson versionCode 22 \
            --argjson size 1189944 \
            '{version:$version,tag:$tag,versionCode:$versionCode,apk:$apk,sha256:$sha256,size:$size,release:$release,notes:$notes}' \
            > latest.json

          CONTENT="$(base64 -w 0 latest.json)"
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/latest.json" --jq .sha 2>/dev/null || true)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/latest.json" \
              -f message="Publish verified DNS Connect 2.1.0 update manifest" \
              -f branch=main -f sha="$SHA" -f content="$CONTENT" >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/latest.json" \
              -f message="Publish verified DNS Connect 2.1.0 update manifest" \
              -f branch=main -f content="$CONTENT" >/dev/null
          fi

      - name: Confirm the public manifest
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://raw.githubusercontent.com/Krenas/DNS-Connect/main/latest.json" \
            -o latest-public.json
          jq -e '
            .version == "2.1.0" and
            .tag == "v2.1.0" and
            .versionCode == 22 and
            .sha256 == "c05e9cb8af2b4193ba2c77fb29bcb889e7588af4e61825af34c92af900c09755" and
            .apk == "https://github.com/Krenas/DNS-Connect/releases/download/v2.1.0/DNS-Connect-2.1.0-release.apk"
          ' latest-public.json
